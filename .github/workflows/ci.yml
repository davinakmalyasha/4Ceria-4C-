# CI for 4Ceria.
#
# Go (API), PostgreSQL (all data, including identity) and Next.js (the PWA).
# The database job is the important one: it builds PostgreSQL from scratch with
# C collation, applies every migration, loads the demo seed, runs the SQL
# behaviour suites, then runs the Go suites against that fresh database. A green
# build that never executed a query is exactly the failure mode a build-only
# pipeline hides.
#
# Every action is pinned to a full commit SHA and every workflow image to a
# digest; `scripts/ci/action-policy.sh` enforces it as its own job.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  action-policy:
    name: Action policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Assert every action and image is pinned
        run: node scripts/ci/action-policy.mjs

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The tree being shipped, not the pre-rewrite history.
      - name: Scan the shipped tree for secrets
        run: |
          docker run --rm -v "$PWD:/repo" \
            zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            detect --no-git --source=/repo --config=/repo/.gitleaks.toml \
            --no-banner --redact --verbose --exit-code 1

      - name: Assert no VAPID private key is tracked
        run: |
          if git grep -nE 'VAPID_PRIVATE_KEY=[A-Za-z0-9_-]{20,}' -- . \
            ':!.github/workflows/*'; then
            echo "::error::A VAPID private key appears to be committed. Rotate the keypair and purge it from history."
            exit 1
          fi
          echo "No VAPID private key in the tree."

  go:
    name: Go suites
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.27.3'
          cache: true

      - name: Formatting
        run: |
          unformatted=$(gofmt -l ./cmd ./internal)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt reports unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: The suites
        run: go test ./...

      - name: Coverage gate (critical pure-unit bars)
        run: node scripts/ci/coverage-gate.mjs

  web:
    name: Next.js
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Type check
        working-directory: web
        run: npx tsc --noEmit

      - name: Unit tests
        working-directory: web
        run: npm run test:cov

      - name: Build
        working-directory: web
        run: npm run build

  database:
    name: PostgreSQL baseline, seed and DB tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:17@sha256:a63c1ea3f6a3a5a1621f97d2aba3b30faecfab4224c1b0000cc85ced57bb1939
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
          --health-start-period=30s

    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/4ceria_pgcheck

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.27.3'
          cache: true

      - name: Build PostgreSQL from scratch (C collation, migrations, seed, SQL suites)
        run: node tools/db/verify-postgres-baseline.mjs --database=4ceria_pgcheck

      - name: Go suites against the fresh database
        run: go test ./...

      - name: Coverage ratchet (DB-backed packages)
        run: |
          set +e
          go test -count=1 -cover ./internal/httpapi/ ./internal/ai/ > /tmp/dbcov.log 2>&1
          status=$?
          set -e
          cat /tmp/dbcov.log
          if [ $status -ne 0 ]; then echo "::error::go test failed, see above"; exit 1; fi
          node -e "
            const fs = require('fs');
            const bars = { 'internal/httpapi': 50, 'internal/ai': 92 };
            let fail = false, seen = new Set();
            for (const line of fs.readFileSync('/tmp/dbcov.log', 'utf8').split('\n')) {
              const m = line.match(/.*(internal\/(?:httpapi|ai))\s+(?:[\d.]+s|\(cached\))\s+coverage:\s+([\d.]+)%/);
              if (!m) continue;
              const pkg = m[1], pct = parseFloat(m[2]), bar = bars[pkg];
              seen.add(pkg);
              if (pct < bar) { console.error('::error::' + pkg + ' ' + pct + '% < bar ' + bar + '%'); fail = true; }
              else console.log(pkg + ' ' + pct + '% >= ' + bar + '% OK');
            }
            for (const pkg of Object.keys(bars)) if (!seen.has(pkg)) { console.error('::error::no coverage line for ' + pkg); fail = true; }
            if (fail) process.exit(1);
          "

  docker:
    name: API image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the gateway image
        run: docker build -t 4ceria-api:ci .
