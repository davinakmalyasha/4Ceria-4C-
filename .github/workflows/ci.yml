# CI for 4Ceria.
#
# The stack is Go (API + ETL), PostgreSQL (all application data), MySQL
# (identity: users, tokens and the role tables — ADR-0018) and Next.js (the
# SPA). The Laravel application and the Vite SPA it served are gone; the
# legacy MySQL schema is frozen in `db/mysql/`.
#
# Every action is pinned to a full commit SHA and every image to a digest.
# `scripts/ci/action-policy.sh` enforces that and is itself a job: a policy
# that is only written down is not a policy.
#
# The database job is the important one. It builds PostgreSQL from scratch,
# diffs the result against the live MySQL schema, loads the ETL, and asserts
# that both engines hold the same number of rows — because a green build that
# copied nothing is exactly the failure mode a build-only pipeline hides.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GOEXPERIMENT: nojsonv2

jobs:
  action-policy:
    name: Action policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Assert every action and image is pinned
        run: bash scripts/ci/action-policy.sh

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The TREE, not the history. The pre-rewrite history contains findings
      # that were committed before this pipeline existed (old Blade templates
      # and a local tool's virtualenv). Scanning all of history would fail
      # every run on commits nobody can change without rewriting the
      # repository. What must be true is that the tree being shipped carries
      # no secret — that is what this checks.
      - name: Scan the shipped tree for secrets
        run: |
          docker run --rm -v "$PWD:/repo" \
            zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            detect --no-git --source=/repo --config=/repo/.gitleaks.toml \
            --no-banner --redact --verbose --exit-code 1

      - name: Assert no VAPID private key is tracked
        run: |
          # The web-push VAPID private key is a live secret: anyone holding it
          # can push arbitrary notifications to every subscribed user.
          if git grep -nE 'VAPID_PRIVATE_KEY=[A-Za-z0-9_-]{20,}' -- . \
            ':!.github/workflows/*'; then
            echo "::error::A VAPID private key appears to be committed. Rotate the keypair and purge it from history."
            exit 1
          fi
          echo "No VAPID private key in the tree."

  go:
    name: Go suites
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.27.3'
          cache: true

      - name: Formatting
        run: |
          unformatted=$(gofmt -l ./cmd ./internal)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt reports unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: The suites
        run: go test ./...

  web:
    name: Next.js
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Type check
        working-directory: web
        run: npx tsc --noEmit

      - name: Build
        working-directory: web
        run: npm run build

  database:
    name: PostgreSQL + ETL
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      mysql:
        image: mysql:9.6@sha256:c5df04bee1a42b74a5841c6409e669cf62126cd0416f00c1cea8ab933b9361b9
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: 4ceria
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
          --health-start-period=30s

      postgres:
        image: postgres:17@sha256:a63c1ea3f6a3a5a1621f97d2aba3b30faecfab4224c1b0000cc85ced57bb1939
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
          --health-start-period=30s

    env:
      MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/4ceria?parseTime=false
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: '3306'
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      MYSQL_DATABASE: 4ceria
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/4ceria_pgcheck
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.27.3'
          cache: true

      # MySQL owns identity (ADR-0018). The schema is frozen in `db/mysql/`,
      # and the demo rows are what make the ETL row-count check meaningful:
      # on an empty database both sides are zero and the comparison passes
      # without exercising anything.
      - name: Restore the frozen MySQL schema and demo rows
        run: |
          mysql -h 127.0.0.1 -uroot -proot 4ceria < db/mysql/schema.sql
          mysql -h 127.0.0.1 -uroot -proot 4ceria < db/mysql/demo.sql

      - name: The PostgreSQL baseline must build from scratch and match MySQL
        run: node tools/db/verify-postgres-baseline.mjs --database=4ceria_pgcheck --pg-dsn=postgres://postgres:postgres@127.0.0.1:5432/4ceria_pgcheck

      # THE SHAPE IS CHECKED ABOVE. This checks the CONTENT: the ETL has to be
      # able to put the live rows into that shape, and the two databases have
      # to agree on how many there are.
      - name: The ETL must reproduce the MySQL rows in PostgreSQL
        run: go run ./cmd/etl -all -truncate

      - name: The two databases must hold the same number of rows
        run: go run ./cmd/etl -all -verify
