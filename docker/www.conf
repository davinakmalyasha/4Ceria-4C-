[www]
user = www-data
group = www-data
listen = 127.0.0.1:9000

pm = ondemand
pm.max_children = 20
pm.process_idle_timeout = 10s
pm.max_requests = 500

; Health check endpoint should be fast, but give room for actual work
request_terminate_timeout = 300

clear_env = no
catch_workers_output = yes
decorate_workers_output = no
